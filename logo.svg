<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente radial suave -->
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#E31837;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C01530;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Fondo -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  
  <!-- Carrito de compras (líneas limpias y simples) -->
  <g stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    
    <!-- Cuerpo del carrito -->
    <path d="M 190 180 L 360 180 L 360 320 L 160 320 L 190 180 Z"/>
    
    <!-- Manija del carrito -->
    <path d="M 140 140 Q 140 180 160 180"/>
    <line x1="140" y1="140" x2="140" y2="240"/>
    
  </g>
  
  <!-- Ruedas -->
  <g>
    <!-- Rueda izquierda -->
    <circle cx="220" cy="370" r="22" fill="#FFFFFF"/>
    <circle cx="220" cy="370" r="14" fill="#E31837"/>
    
    <!-- Rueda derecha -->
    <circle cx="320" cy="370" r="22" fill="#FFFFFF"/>
    <circle cx="320" cy="370" r="14" fill="#E31837"/>
  </g>
</svg>
